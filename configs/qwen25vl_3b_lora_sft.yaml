### Stage 1: Qwen2.5-VL-3B Frozen-ViT LoRA SFT (LLaMA-Factory)
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
stage: sft
do_train: true
finetuning_type: lora

### Freeze vision tower, tune projector + LLM LoRA adapters
freeze_vision_tower: true
freeze_multi_modal_projector: false
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### Dataset
dataset: pavetrack_sft_train
eval_dataset: pavetrack_sft_val
template: qwen2_vl
cutoff_len: 2048
image_max_pixels: 802816
overwrite_cache: true
preprocessing_num_workers: 8

### Output & Precision
output_dir: saves/qwen25vl-3b/lora/sft
logging_steps: 20
save_steps: 500
eval_steps: 500
eval_strategy: steps
per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
bf16: true
plot_loss: true
